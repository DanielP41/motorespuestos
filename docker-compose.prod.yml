# Archivo standalone para producción — NO se usa junto con docker-compose.yml.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requisitos previos en el VPS:
#   - Copiar .env.example a .env y completar TODOS los valores
#   - El dominio debe apuntar al servidor (DNS A record para @ y api.*)
#   - Puertos 80 y 443 abiertos en el firewall de Hostinger

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: moto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Puerto NO expuesto — solo accesible dentro de la red Docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: moto_backend
    restart: unless-stopped
    # Puerto NO expuesto — Caddy hace de proxy internamente
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - API_BASE_URL=${API_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/app/uploads  # volumen nombrado: las imágenes sobreviven redeploys

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}  # bakeado en el bundle de Vite al compilar
    container_name: moto_frontend
    restart: unless-stopped
    # Puerto NO expuesto — Caddy hace de proxy internamente
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: moto_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
