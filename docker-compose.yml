rversion: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: moto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moto_user
      POSTGRES_PASSWORD: moto_pass_2026
      POSTGRES_DB: moto_repuestos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moto_user -d moto_repuestos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
