version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: moto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moto_user
      POSTGRES_PASSWORD: moto_pass_2026
      POSTGRES_DB: moto_repuestos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moto_user -d moto_repuestos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: moto_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://moto_user:moto_pass_2026@postgres:5432/moto_repuestos
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/app/uploads:/app/app/uploads

  frontend:
    build: ./frontend
    container_name: moto_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
